# Copies the weekly leaderboards from Capri Browser's own server (worker/ on Cloudflare) into LEADERBOARD.md.
# It only downloads the board as text; nothing it gets is ever run, and only lines shaped like the board are allowed in.
# No keys: the server's board is public.
name: Leaderboard

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the boards
        run: |
          curl -fsS --max-time 30 https://capri-browser.tobiasprojects77.workers.dev/board.md -o board.md
          [ "$(wc -c < board.md)" -lt 200000 ]
          # Every line must be one the board makes (names, numbers, headings), so nothing else can ever get into the repo,
          # not even if the server were broken into. One odd line and nothing is copied.
          if grep -vxEf .github/board-lines.txt board.md; then echo "Unexpected lines above: not copying the board."; exit 1; fi
          mv board.md LEADERBOARD.md
      - name: Save
        run: |
          git config user.name "capri-leaderboard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git diff --cached --quiet || (git commit -m "Leaderboard copy" && git pull --rebase && git push)
