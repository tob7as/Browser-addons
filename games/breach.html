<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Breach - Capri Browser</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a10 radial-gradient(ellipse 900px 420px at 50% -120px,#360e1a,transparent) no-repeat fixed; color:#ececf1; font-family:Bahnschrift,'Segoe UI',sans-serif; }
  .card { text-align:center; padding:24px; width:min(520px,100%); }
  h1 { margin:0 0 6px; color:#e84246; font-size:22px; letter-spacing:5px; font-weight:600; }
  p { margin:0 0 16px; color:#92828c; line-height:1.4; }
  p b { color:#5ef0f6; font-weight:600; }
  #log { font:20px Consolas,monospace; background:#11101c; box-shadow:inset 0 0 0 1px #5c1824; padding:12px; min-height:60px; text-align:left; }
  #log div { display:flex; justify-content:space-between; padding:3px 6px; }
  #log span { color:#92828c; font-size:16px; }
  input { width:100%; box-sizing:border-box; margin-top:12px; background:#0a0a10; color:#ececf1; border:1px solid #5c1824; padding:12px; font:22px Consolas,monospace; letter-spacing:8px; text-align:center; outline:none; }
  input:focus { border-color:#e84246; }
  #s { font-size:20px; color:#5ef0f6; margin:14px 0 10px; letter-spacing:2px; min-height:26px; }
  a { color:#e84246; text-decoration:none; letter-spacing:2px; margin:0 12px; cursor:pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>CODE BREACH</h1>
  <p>Crack the 4-digit ICE code. Each digit is 1 to 6. After a guess, <b>HIT</b> is a right digit in the right place, <b>NEAR</b> is a right digit in the wrong place. Eight tries.</p>
  <div id="log"></div>
  <input id="i" maxlength="4" inputmode="numeric" placeholder="1234" autofocus>
  <div id="s"></div>
  <a onclick="start()">NEW CODE</a><a href="https://capri.dial/play?g=quit">CANCEL</a>
</div>
<script>
  var code, tries, over, log = document.getElementById('log'), i = document.getElementById('i'), s = document.getElementById('s');
  function start() {
    code = ''; for (var k = 0; k < 4; k++) code += 1 + Math.floor(Math.random() * 6);
    tries = 0; over = false; log.innerHTML = ''; s.textContent = '8 tries left'; i.disabled = false; i.value = ''; i.focus();
  }
  i.onkeydown = function (e) {
    if (e.key != 'Enter' || over) return;
    var v = i.value.trim();
    if (!/^[1-6]{4}$/.test(v)) { s.textContent = 'Four digits, each 1 to 6.'; return; }
    var hit = 0, near = 0, a = {}, b = {};
    for (var k = 0; k < 4; k++) { if (v[k] == code[k]) hit++; else { a[code[k]] = (a[code[k]] || 0) + 1; b[v[k]] = (b[v[k]] || 0) + 1; } }
    for (var d in b) near += Math.min(b[d], a[d] || 0);
    tries++;
    var row = document.createElement('div'); row.innerHTML = '<b>' + v + '</b><span>' + hit + ' HIT  ' + near + ' NEAR</span>'; log.appendChild(row);
    i.value = '';
    if (hit == 4) { over = true; i.disabled = true; s.textContent = 'ICE breached in ' + tries + ' tries. Nice work, netrunner.'; }
    else if (tries >= 8) { over = true; i.disabled = true; s.textContent = 'Traced! The code was ' + code + '.'; }
    else s.textContent = (8 - tries) + ' tries left';
  };
  start();
</script>
</body>
</html>
