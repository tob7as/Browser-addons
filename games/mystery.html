<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mystery Choom - Capri Browser</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a10 radial-gradient(ellipse 900px 420px at 50% -120px,#360e1a,transparent) no-repeat fixed; color:#ececf1; font-family:Bahnschrift,'Segoe UI',sans-serif; }
  .card { text-align:center; padding:20px; width:min(780px,100%); }
  h1 { margin:0 0 4px; color:#e84246; font-size:22px; letter-spacing:5px; font-weight:600; }
  p { margin:0 0 12px; color:#92828c; }
  #grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px; }
  .c { background:linear-gradient(#1a1030,#0d0c18); border:1px solid #5c1824; padding:4px 2px 6px; cursor:pointer; transition:opacity .3s, border-color .2s; }
  .c:hover { border-color:#5ef0f6; }
  .c svg { width:100%; height:auto; display:block; }
  .c span { font-size:12px; color:#ececf1; letter-spacing:1px; }
  .c.out { opacity:.15; }
  .c.win { border-color:#5ef0f6; box-shadow:0 0 18px rgba(94,240,246,.5); opacity:1; }
  .c.bad { border-color:#e84246; }
  #qs { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px; }
  #qs button { background:#11101c; color:#ececf1; border:1px solid #5c1824; padding:7px 11px; font:14px Bahnschrift,'Segoe UI',sans-serif; cursor:pointer; }
  #qs button:hover:not(:disabled) { border-color:#5ef0f6; }
  #qs button:disabled { opacity:.3; cursor:default; }
  #msg { min-height:26px; margin:6px 0 8px; font-size:18px; color:#5ef0f6; }
  #msg b { color:#e84246; }
  .links a { color:#e84246; text-decoration:none; letter-spacing:2px; margin:0 12px; cursor:pointer; }
  @media (max-width:560px) { #grid { grid-template-columns:repeat(4,1fr); } }
</style>
</head>
<body>
<div class="card">
  <h1>MYSTERY CHOOM</h1>
  <p>Capri's picked one of these Night City runners. Ask yes or no questions, then click who you think it is. Fewer questions, better score. Two guesses.</p>
  <div id="qs"></div>
  <div id="msg"></div>
  <div id="grid"></div>
  <div class="links"><a id="again">NEW GAME</a><a href="https://capri.dial/play?g=quit">CANCEL</a></div>
</div>
<script>
  // Original anime-style cyberpunk runners, drawn from their traits; nothing is downloaded.
  var NAMES = ['Vex', 'Nova', 'Kiro', 'Jax', 'Rook', 'Lumi', 'Dex', 'Zara', 'Echo', 'Taz', 'Mira', 'Volt', 'Sable', 'Ryn', 'Kade', 'Pixel', 'Nyx', 'Bolt', 'Juno', 'Riot', 'Sly', 'Ash', 'Kai', 'Wren', 'Hana', 'Ren', 'Yuki', 'Sora'];
  var HAIR = { red: ['#ff3d5a', '#a01830'], cyan: ['#5ef0f6', '#1f8fa0'], black: ['#2a2638', '#0e0c16'], blonde: ['#ffd76a', '#c08a2a'], purple: ['#b26cff', '#5a2aa0'], pink: ['#ff7ad0', '#b03080'] };
  var EYE = { cyan: '#2fe0ff', red: '#ff2f4a', gold: '#ffc83a', green: '#3aff9a' };
  var SKIN = ['#ffe0c8', '#f2c4a0', '#c98e66', '#8a5a3c'];
  var QUESTIONS = [
    ['Red hair?', function (c) { return c.hair === 'red'; }], ['Cyan hair?', function (c) { return c.hair === 'cyan'; }],
    ['Black hair?', function (c) { return c.hair === 'black'; }], ['Blonde hair?', function (c) { return c.hair === 'blonde'; }],
    ['Purple hair?', function (c) { return c.hair === 'purple'; }], ['Pink hair?', function (c) { return c.hair === 'pink'; }],
    ['Long hair?', function (c) { return c.long; }], ['Glowing red eyes?', function (c) { return c.eye === 'red'; }],
    ['Cyan eyes?', function (c) { return c.eye === 'cyan'; }], ['Visor?', function (c) { return c.visor; }],
    ['Face chrome?', function (c) { return c.chrome; }], ['Headphones?', function (c) { return c.phones; }],
    ['Face mask?', function (c) { return c.mask; }], ['Neon tattoo?', function (c) { return c.tattoo; }]
  ];
  var people, secret, asked, guesses, over, best = 0, uid = 0;
  var $ = function (id) { return document.getElementById(id); };
  try { best = +localStorage.getItem('mystery-best') || 0; } catch (e) {}
  function any(list) { return list[Math.floor(Math.random() * list.length)]; }
  function chance(p) { return Math.random() < p; }

  function make() {
    var out = [], seen = {}, names = NAMES.slice().sort(function () { return Math.random() - .5; });
    while (out.length < 18) {
      var c = { hair: any(Object.keys(HAIR)), long: chance(.45), eye: any(Object.keys(EYE)), visor: chance(.2), chrome: chance(.35), phones: chance(.3), mask: chance(.2), tattoo: chance(.3), skin: any(SKIN) };
      if (c.visor) c.eye = any(['cyan', 'red']); // the visor glows in their eye colour
      var key = [c.hair, c.long, c.eye, c.visor, c.chrome, c.phones, c.mask, c.tattoo].join();
      if (seen[key]) continue; // every runner can be told apart
      seen[key] = 1; c.name = names[out.length]; out.push(c);
    }
    return out;
  }

  function eye(x, col, flip) {
    var s = flip ? -1 : 1;
    return '<path d="M' + (x - 8 * s) + ' 55 Q' + x + ' 47 ' + (x + 8 * s) + ' 54" stroke="#120e1c" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="' + x + '" cy="59" rx="6" ry="7.5" fill="#fff"/>' +
      '<ellipse cx="' + x + '" cy="60" rx="5" ry="6.6" fill="' + col + '"/>' +
      '<ellipse cx="' + x + '" cy="61" rx="2.4" ry="3.6" fill="#120e1c"/>' +
      '<circle cx="' + (x - 2) + '" cy="56.5" r="1.8" fill="#fff"/><circle cx="' + (x + 2) + '" cy="63" r=".9" fill="#fff"/>';
  }

  function face(c) {
    var h = HAIR[c.hair], e = EYE[c.eye], id = 'g' + (uid++);
    var s = '<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + h[0] + '"/><stop offset="1" stop-color="' + h[1] + '"/></linearGradient></defs>';
    var hair = 'url(#' + id + ')';
    // back hair
    if (c.long) s += '<path d="M20 40 Q16 80 24 104 L36 92 L42 104 L50 94 L58 104 L64 92 L76 104 Q84 80 80 40 Z" fill="' + hair + '"/>';
    // neck and jacket collar
    s += '<rect x="43" y="78" width="14" height="14" fill="' + c.skin + '"/><path d="M18 110 Q22 90 40 88 L50 98 L60 88 Q78 90 82 110 Z" fill="#1e1a2e"/><path d="M40 88 L50 98 L60 88" stroke="#e84246" stroke-width="2" fill="none"/>';
    // anime face: round top, pointed chin
    s += '<path d="M28 48 Q28 28 50 28 Q72 28 72 48 Q72 66 62 76 Q55 83 50 83 Q45 83 38 76 Q28 66 28 48 Z" fill="' + c.skin + '"/>';
    if (c.tattoo) s += '<path d="M31 64 L35 68 L31 72" stroke="#5ef0f6" stroke-width="1.6" fill="none"/><circle cx="34" cy="75" r="1.2" fill="#ff3dd0"/>';
    // eyes or visor
    if (c.visor) s += '<path d="M26 52 L74 52 L72 64 L28 64 Z" fill="' + e + '" opacity=".85"/><path d="M28 55 L72 55" stroke="#fff" stroke-width="1" opacity=".6"/>';
    else s += eye(40, e, false) + eye(60, e, true);
    if (c.chrome) s += '<path d="M64 66 L70 64 L70 74 M66 70 L70 70" stroke="#c8d0e0" stroke-width="1.8" fill="none"/><circle cx="70" cy="74" r="1.6" fill="' + e + '"/>';
    // mouth / mask
    if (c.mask) s += '<path d="M34 68 Q50 66 66 68 L62 80 Q50 86 38 80 Z" fill="#14121e"/><path d="M40 74 L60 74 M42 78 L58 78" stroke="' + e + '" stroke-width="1.2"/>';
    else s += '<path d="M46 74 Q50 76.5 54 74" stroke="#7a2e3a" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    // spiky fringe
    s += '<path d="M24 52 Q22 22 50 18 Q78 22 76 52 L70 38 L66 48 L60 34 L54 46 L48 32 L42 46 L36 36 L32 48 L28 40 Z" fill="' + hair + '"/>';
    s += '<path d="M40 24 Q50 20 60 24" stroke="#fff" stroke-width="1.5" opacity=".35" fill="none"/>';
    if (c.phones) s += '<path d="M22 50 Q22 14 50 14 Q78 14 78 50" stroke="#2a2638" stroke-width="4" fill="none"/><rect x="17" y="46" width="9" height="16" rx="3" fill="#2a2638"/><rect x="74" y="46" width="9" height="16" rx="3" fill="#2a2638"/><rect x="19" y="50" width="2" height="8" fill="' + e + '"/><rect x="79" y="50" width="2" height="8" fill="' + e + '"/>';
    return s + '</svg>';
  }

  function start() {
    people = make(); secret = any(people); asked = 0; guesses = 2; over = false;
    var grid = $('grid'); grid.innerHTML = '';
    people.forEach(function (c) {
      var d = document.createElement('div'); d.className = 'c'; d.innerHTML = face(c) + '<span></span>';
      d.querySelector('span').textContent = c.name; d.onclick = function () { guess(c, d); }; c.el = d; grid.appendChild(d);
    });
    var qs = $('qs'); qs.innerHTML = '';
    QUESTIONS.forEach(function (q) { var b = document.createElement('button'); b.textContent = q[0]; b.onclick = function () { ask(q, b); }; qs.appendChild(b); });
    $('msg').textContent = 'Ask away, choom.' + (best ? ' Best: ' + best + ' questions.' : '');
  }

  function ask(q, b) {
    if (over) return;
    b.disabled = true; asked++;
    var yes = q[1](secret);
    people.forEach(function (c) { if (q[1](c) !== yes) c.el.classList.add('out'); });
    $('msg').textContent = q[0] + ' ' + (yes ? 'Yep.' : 'Nope.') + ' (' + asked + ' question' + (asked === 1 ? '' : 's') + ')';
  }

  function guess(c, d) {
    if (over || d.classList.contains('out')) return;
    if (c === secret) {
      over = true; d.classList.add('win');
      var line = 'Got it! It was ' + c.name + ', in ' + asked + ' question' + (asked === 1 ? '' : 's') + '.';
      if (!best || asked < best) { best = asked; try { localStorage.setItem('mystery-best', best); } catch (e) {} line += ' New best!'; }
      $('msg').textContent = line;
      return;
    }
    guesses--; d.classList.add('bad', 'out');
    if (guesses <= 0) { over = true; secret.el.classList.remove('out'); secret.el.classList.add('win'); $('msg').innerHTML = 'Flatlined. It was <b></b>.'; $('msg').querySelector('b').textContent = secret.name; return; }
    $('msg').textContent = 'Not ' + c.name + '. One guess left.';
  }

  $('again').onclick = start;
  start();
</script>
</body>
</html>
