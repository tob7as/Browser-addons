<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mystery Choom - Capri Browser</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a10 radial-gradient(ellipse 900px 420px at 50% -120px,#360e1a,transparent) no-repeat fixed; color:#ececf1; font-family:Bahnschrift,'Segoe UI',sans-serif; }
  .card { text-align:center; padding:20px; width:min(820px,100%); }
  h1 { margin:0 0 4px; color:#e84246; font-size:22px; letter-spacing:5px; font-weight:600; }
  p { margin:0 0 12px; color:#92828c; }
  #grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px; }
  .c { background:#11101c; border:1px solid #5c1824; padding:3px 3px 6px; cursor:pointer; transition:opacity .3s, border-color .2s; }
  .c:hover { border-color:#5ef0f6; }
  .c img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; margin-bottom:4px; }
  .c span { font-size:12px; color:#ececf1; letter-spacing:1px; }
  .c.out { opacity:.15; }
  .c.win { border-color:#5ef0f6; box-shadow:0 0 18px rgba(94,240,246,.5); opacity:1; }
  .c.bad { border-color:#e84246; }
  #qs { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px; }
  #qs button { background:#11101c; color:#ececf1; border:1px solid #5c1824; padding:7px 11px; font:14px Bahnschrift,'Segoe UI',sans-serif; cursor:pointer; }
  #qs button:hover:not(:disabled) { border-color:#5ef0f6; }
  #qs button:disabled { opacity:.3; cursor:default; }
  #msg { min-height:26px; margin:6px 0 8px; font-size:18px; color:#5ef0f6; }
  #msg b { color:#e84246; }
  .links a { color:#e84246; text-decoration:none; letter-spacing:2px; margin:0 12px; cursor:pointer; }
  .small { font-size:12px; color:#5f5560; margin-top:14px; }
  @media (max-width:560px) { #grid { grid-template-columns:repeat(4,1fr); } }
</style>
</head>
<body>
<div class="card">
  <h1>MYSTERY CHOOM</h1>
  <p>Capri's picked someone from Cyberpunk: Edgerunners 1 or 2. Ask yes or no questions, then click who you think it is. Fewer questions, better score. Two guesses.</p>
  <div id="qs"></div>
  <div id="msg"></div>
  <div id="grid"></div>
  <div class="links"><a id="again">NEW GAME</a><a href="https://capri.dial/play?g=quit">CANCEL</a></div>
  <div class="small">Pictures from AniList.</div>
</div>
<script>
  // Edgerunners characters. Pictures load live from AniList; only ids and traits are kept here.
  // [AniList id, name, season, hair, woman, eyewear, mask, full chrome body, hood]
  var CAST = [
    [284157, 'Lucy', 1, 'white', 1, 0, 0, 0, 0], [284158, 'David Martinez', 1, 'dark', 0, 0, 0, 0, 0],
    [284159, 'Maine', 1, 'blonde', 0, 1, 0, 0, 0], [284160, 'Dorio', 1, 'blonde', 1, 0, 0, 0, 0],
    [284161, 'Kiwi', 1, 'pink', 1, 0, 1, 0, 0], [284162, 'Pilar', 1, 'none', 0, 1, 0, 0, 0],
    [284163, 'Rebecca', 1, 'cyan', 1, 0, 0, 0, 0], [284165, 'Faraday', 1, 'white', 0, 0, 0, 0, 0],
    [284166, 'Gloria Martinez', 1, 'pink', 1, 0, 0, 0, 0], [287420, 'Falco', 1, 'dark', 0, 0, 0, 0, 0],
    [287490, 'Adam Smasher', 1, 'none', 0, 0, 0, 1, 0],
    [402555, 'D', 2, 'dark', 0, 0, 0, 0, 0], [402617, 'Roman Carax', 2, 'blonde', 0, 0, 0, 0, 0],
    [402683, 'Talia Yang', 2, 'pink', 1, 0, 1, 0, 0], [407502, 'Avida Yang', 2, 'dark', 1, 0, 0, 0, 0],
    [410878, 'Jessie', 2, 'white', 1, 0, 0, 0, 0], [410880, 'Meshuga', 2, 'blonde', 0, 0, 0, 0, 1],
    [410881, 'Kitano', 2, 'white', 0, 1, 0, 0, 0]
  ].map(function (r) { return { id: r[0], name: r[1], season: r[2], hair: r[3], woman: r[4], eyewear: r[5], mask: r[6], chrome: r[7], hood: r[8] }; });
  function is(k, v) { return function (c) { return c[k] === v; }; }
  function has(k) { return function (c) { return !!c[k]; }; }
  var QUESTIONS = [
    ['A woman?', has('woman')], ['From season 2?', is('season', 2)],
    ['Black or brown hair?', is('hair', 'dark')], ['Blonde hair?', is('hair', 'blonde')], ['White or grey hair?', is('hair', 'white')],
    ['Pink, red or purple hair?', is('hair', 'pink')], ['Cyan hair?', is('hair', 'cyan')], ['No hair showing?', is('hair', 'none')],
    ['Shades, visor or glasses?', has('eyewear')], ['Face mask?', has('mask')], ['Hood up?', has('hood')], ['Full chrome body?', has('chrome')]
  ];
  var people = [], secret, asked, guesses, over, best = 0;
  var $ = function (id) { return document.getElementById(id); };
  try { best = +localStorage.getItem('mystery-best') || 0; } catch (e) {}

  function start() {
    secret = people[Math.floor(Math.random() * people.length)]; asked = 0; guesses = 2; over = false;
    var grid = $('grid'); grid.innerHTML = '';
    people.slice().sort(function () { return Math.random() - .5; }).forEach(function (c) {
      var d = document.createElement('div'); d.className = 'c';
      var img = document.createElement('img'); img.src = c.pic; img.alt = ''; d.appendChild(img);
      var sp = document.createElement('span'); sp.textContent = c.name; d.appendChild(sp);
      d.onclick = function () { guess(c, d); }; c.el = d; grid.appendChild(d);
    });
    var qs = $('qs'); qs.innerHTML = '';
    QUESTIONS.forEach(function (q) { var b = document.createElement('button'); b.textContent = q[0]; b.onclick = function () { ask(q, b); }; qs.appendChild(b); });
    $('msg').textContent = 'Ask away, choom.' + (best ? ' Best: ' + best + ' questions.' : '');
  }

  function ask(q, b) {
    if (over) return;
    b.disabled = true; asked++;
    var yes = q[1](secret);
    people.forEach(function (c) { if (q[1](c) !== yes) c.el.classList.add('out'); });
    $('msg').textContent = q[0] + ' ' + (yes ? 'Yep.' : 'Nope.') + ' (' + asked + ' question' + (asked === 1 ? '' : 's') + ')';
  }

  function guess(c, d) {
    if (over || d.classList.contains('out')) return;
    if (c === secret) {
      over = true; d.classList.add('win');
      var line = 'Got it! It was ' + c.name + ', in ' + asked + ' question' + (asked === 1 ? '' : 's') + '.';
      if (!best || asked < best) { best = asked; try { localStorage.setItem('mystery-best', best); } catch (e) {} line += ' New best!'; }
      $('msg').textContent = line;
      return;
    }
    guesses--; d.classList.add('bad', 'out');
    if (guesses <= 0) { over = true; secret.el.classList.remove('out'); secret.el.classList.add('win'); $('msg').innerHTML = 'Flatlined. It was <b></b>.'; $('msg').querySelector('b').textContent = secret.name; return; }
    $('msg').textContent = 'Not ' + c.name + '. One guess left.';
  }

  $('again').onclick = function () { if (people.length) start(); };
  $('msg').textContent = 'Loading Edgerunners...';
  fetch('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ query: 'query($ids:[Int]){Page(perPage:50){characters(id_in:$ids){id image{large}}}}', variables: { ids: CAST.map(function (c) { return c.id; }) } }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var pics = {}; j.data.Page.characters.forEach(function (c) { pics[c.id] = c.image.large; });
      people = CAST.filter(function (c) { return (c.pic = pics[c.id]); });
      if (people.length < 8) throw new Error('few');
      start();
    })
    .catch(function () { $('msg').textContent = "Couldn't reach AniList right now, choom. Try again in a bit."; });
</script>
</body>
</html>
