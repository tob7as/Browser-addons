<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Test - Capri Browser</title>
<style>
  :root { --ground:#0a0a10; --field:#11101c; --edge:#5c1824; --hot:#e84246; --cyan:#5ef0f6; --white:#ececf1; --faint:#92828c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--ground) radial-gradient(ellipse 900px 420px at 50% -120px,#360e1a,transparent) no-repeat fixed; color:var(--white);
         font-family:Bahnschrift,'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { width:min(640px,100%); background:var(--field); box-shadow:inset 0 0 0 1px var(--edge); padding:28px 28px 24px;
          clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%); text-align:center; }
  h1 { margin:0 0 6px; color:var(--hot); font-size:22px; letter-spacing:5px; font-weight:600; }
  p { margin:0 0 20px; color:var(--faint); }
  #pad { height:260px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
         background:#0c0b14; box-shadow:inset 0 0 0 1px #481c28; font-size:26px; letter-spacing:3px; transition:background .08s;
         clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%); }
  #pad.wait { color:var(--faint); }
  #pad.go { background:var(--cyan); color:#060e12; box-shadow:0 0 40px rgba(94,240,246,.6); }
  #pad.early { color:var(--hot); }
  .stats { display:flex; justify-content:center; gap:34px; margin-top:18px; color:var(--faint); font-size:14px; letter-spacing:1px; }
  .stats b { display:block; color:var(--cyan); font-size:24px; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <h1>REACTION TEST</h1>
  <p>Click the panel when it turns cyan. Five rounds, then your average.</p>
  <div id="pad" class="wait">CLICK TO START</div>
  <div class="stats"><div><b id="last">-</b>last</div><div><b id="avg">-</b>average</div><div><b id="best">-</b>your best</div></div>
</div>
<script>
  var pad = document.getElementById('pad'), state = 'idle', timer = 0, shownAt = 0, times = [];
  var best = 0;
  try { best = +localStorage.getItem('capri-reaction-best') || 0; } catch (e) {}
  function show(id, ms) { document.getElementById(id).textContent = ms ? ms + ' ms' : '-'; }
  show('best', best);
  function arm() {
    state = 'waiting'; pad.className = 'wait'; pad.textContent = 'WAIT FOR CYAN...';
    timer = setTimeout(function () { state = 'go'; pad.className = 'go'; pad.textContent = 'NOW!'; shownAt = performance.now(); }, 1200 + Math.random() * 2600);
  }
  pad.addEventListener('mousedown', function () {
    if (state === 'idle' || state === 'done') { times = []; show('avg', 0); arm(); return; }
    if (state === 'waiting') { clearTimeout(timer); state = 'idle'; pad.className = 'early'; pad.textContent = 'TOO EARLY. CLICK TO TRY AGAIN'; return; }
    if (state === 'go') {
      var ms = Math.round(performance.now() - shownAt);
      times.push(ms); show('last', ms);
      if (times.length < 5) { arm(); return; }
      var avg = Math.round(times.reduce(function (a, b) { return a + b; }, 0) / times.length);
      show('avg', avg);
      if (!best || avg < best) { best = avg; show('best', best); try { localStorage.setItem('capri-reaction-best', best); } catch (e) {} }
      state = 'done'; pad.className = 'wait'; pad.textContent = 'AVERAGE ' + avg + ' MS. CLICK TO GO AGAIN';
    }
  });
</script>
</body>
</html>
