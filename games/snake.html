<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake - Capri Browser</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0a10 radial-gradient(ellipse 900px 420px at 50% -120px,#360e1a,transparent) no-repeat fixed; color:#ececf1; font-family:Bahnschrift,'Segoe UI',sans-serif; }
  .card { text-align:center; padding:24px; }
  h1 { margin:0 0 6px; color:#e84246; font-size:22px; letter-spacing:5px; font-weight:600; }
  p { margin:0 0 14px; color:#92828c; }
  canvas { background:#11101c; box-shadow:inset 0 0 0 1px #5c1824, 0 0 30px rgba(232,66,70,.15); max-width:100%; }
  #s { font-size:22px; color:#5ef0f6; margin:12px 0; letter-spacing:2px; }
  a { color:#e84246; text-decoration:none; letter-spacing:2px; }
</style>
</head>
<body>
<div class="card">
  <h1>NEON SNAKE</h1>
  <p>Arrow keys or WASD. Eat the cyan data, don't hit yourself or the walls. Space to restart.</p>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="s">0</div>
  <a href="https://capri.dial/play?g=quit">CANCEL</a>
</div>
<script>
  var c = document.getElementById('c'), x = c.getContext('2d'), out = document.getElementById('s');
  var N = 20, Z = 20, snake, dir, next, food, score, dead, best = 0, timer;
  function spot() { var f; do { f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (snake.some(function (p) { return p.x == f.x && p.y == f.y; })); return f; }
  function start() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }]; dir = next = { x: 1, y: 0 }; score = 0; dead = false; food = spot();
    clearInterval(timer); timer = setInterval(step, 120); draw();
  }
  function step() {
    dir = next;
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(function (p) { return p.x == h.x && p.y == h.y; })) {
      dead = true; clearInterval(timer); best = Math.max(best, score); draw(); if (score) location.href = 'https://capri.dial/play?g=snaked&s=' + score; return;
    }
    snake.unshift(h);
    if (h.x == food.x && h.y == food.y) {
      score++; food = spot();
      // Faster every 5 points.
      if (score % 5 == 0) { clearInterval(timer); timer = setInterval(step, Math.max(55, 120 - score * 3)); }
    } else snake.pop();
    draw();
  }
  function draw() {
    x.fillStyle = '#11101c'; x.fillRect(0, 0, 400, 400);
    x.shadowBlur = 12; x.shadowColor = '#5ef0f6'; x.fillStyle = '#5ef0f6'; x.fillRect(food.x * Z + 4, food.y * Z + 4, Z - 8, Z - 8);
    x.shadowColor = '#e84246';
    snake.forEach(function (p, i) { x.fillStyle = i ? '#a8303a' : '#e84246'; x.fillRect(p.x * Z + 1, p.y * Z + 1, Z - 2, Z - 2); });
    x.shadowBlur = 0;
    out.textContent = dead ? 'Flatlined: ' + score + '  ·  Best: ' + best + '  ·  Space to retry' : score;
  }
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase(), m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
    if (k == ' ') { e.preventDefault(); if (dead) start(); return; }
    if (!m) return;
    e.preventDefault();
    if (m[0] == -dir.x && m[1] == -dir.y) return;
    next = { x: m[0], y: m[1] };
  });
  start();
</script>
</body>
</html>
