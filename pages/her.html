<style>
.hp{max-width:1040px;margin:0 auto;padding:28px 24px 90px;font-family:Bahnschrift,'Segoe UI',sans-serif;color:%C2%}
.hp .top{display:flex;gap:24px;align-items:center;border-bottom:2px solid %C5%;padding-bottom:20px;margin-bottom:20px}
.hp .face{width:120px;height:120px;flex:none;display:flex;align-items:center;justify-content:center;background:%C1%;border:2px solid %C5%;cursor:pointer;font-size:34px;color:%C4%;overflow:hidden;user-select:none}
.hp .face img{max-width:100%;max-height:100%}
.hp .face:active{transform:scale(.94)}
.hp h1{margin:0;font-size:38px;letter-spacing:7px;color:%C5%;font-weight:600}
.hp .mood{font-size:17px;color:%C4%;margin-top:6px}.hp .lv{font-size:13px;color:%C3%;margin-top:6px;letter-spacing:1px}
.hp .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;align-items:start}
.hp .c{background:%C1%;border:1px solid %C6%;padding:14px 18px 16px;min-width:0;overflow-wrap:anywhere;animation:hpin .4s both}
@keyframes hpin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hp .c.w{grid-column:1/-1}
.hp h2{font-size:13px;letter-spacing:3px;color:%C5%;margin:0 0 10px;font-weight:600}
.hp p{margin:6px 0;line-height:1.45;font-size:15px}.hp .f{color:%C3%;font-size:13px}
.hp a.l{display:block;color:%C4%;text-decoration:none;padding:7px 0 2px;cursor:pointer}.hp a.l:hover{text-decoration:underline}
.hp .tab{background:%C0%;border:1px solid %C6%;border-top:2px solid %C4%;padding:7px 10px;margin:6px 0;font-size:14px;color:%C3%}
.hp button{background:%C0%;color:%C4%;border:1px solid %C6%;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;margin:4px 6px 0 0}.hp button:hover{border-color:%C4%}
.hp input{width:100%;box-sizing:border-box;background:%C0%;color:%C2%;border:1px solid %C6%;padding:9px 11px;font:inherit;outline:none}.hp input:focus{border-color:%C4%}
.hp .say{border-left:2px solid %C4%;padding-left:10px;margin:8px 0}.hp .say.her{border-color:%C5%}
.hp .blur{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .25s}
.hp .stamp{display:inline-block;border:2px solid %C5%;color:%C5%;padding:5px 12px;letter-spacing:2px;transform:rotate(-3deg);font-weight:600;margin-top:8px}
.hp .shelf{display:flex;flex-wrap:wrap;gap:8px}.hp .it{border:1px solid %C6%;padding:6px 10px;font-size:13px}.hp .it.no{color:%C3%;opacity:.5}
.hp .hid{cursor:pointer;color:%C4%;font-size:18px;display:inline-block;animation:hpb 2.4s infinite}@keyframes hpb{50%{opacity:.25}}
.hp.br{animation:hpg .18s steps(2) 10}@keyframes hpg{0%{transform:none}25%{transform:translate(-6px,3px) skewX(3deg);filter:hue-rotate(60deg)}75%{transform:translate(6px,-3px) skewX(-3deg)}}
.hp .x{float:right;color:%C3%;cursor:pointer;padding:0 4px}.hp .x:hover{color:%C5%}
@media (prefers-reduced-motion:reduce){.hp *,.hp{animation:none!important}}
</style>
